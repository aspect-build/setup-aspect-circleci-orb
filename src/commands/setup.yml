description: >
  Configure the job for vanilla `bazel` calls. On a stock executor: install the
  Aspect CLI launcher and Bazelisk (each skipped when already on PATH),
  authenticate if ASPECT_API_TOKEN is set, and write a ~/.bazelrc pointing at
  the Aspect deployment's remote cache and BES via
  `aspect setup bazelrc --home`. On an Aspect Workflows runner: wait for cache
  warming to complete and generate the runner's own rc instead (via
  `aspect setup bazelrc`, with a legacy fallback for runners whose CLI predates
  that task).

  Add this as a step after `checkout` and before any step that calls `bazel`
  directly. The rc generator reads the workspace's `.bazelversion`, so the repo
  must already be checked out (CWD = the workspace root).

  Set ASPECT_API_TOKEN from a CircleCI context or project environment variable
  so Bazel can authenticate to the cache the generated rc names. The command
  writes the PATH additions to ${BASH_ENV}, so later steps in the job see
  `aspect` and `bazel` too.

steps:
  - run:
      name: "Setup Aspect"
      command: <<include(scripts/setup.sh)>>
