version: 2.1

description: >
  CircleCI orb that installs the Aspect CLI launcher, installs Bazelisk
  (skipped automatically if `bazel` is already on PATH), points Bazel at Aspect
  Cloud's remote cache and BES, and authenticates with the Aspect API — all in
  one step. On an Aspect Workflows runner it points Bazel at that runner's own
  services instead, after waiting for its cache warming. The CircleCI
  counterpart of aspect-build/setup-aspect (GitHub Actions) and
  aspect-build/setup-aspect-buildkite-plugin (Buildkite).

display:
  home_url: https://docs.aspect.build/workflows
  source_url: https://github.com/aspect-build/setup-aspect-circleci-orb
